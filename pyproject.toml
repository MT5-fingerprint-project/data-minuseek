[project]
name = "data-minuseek"
version = "0.1.0"
description = "Minimal FastAPI skeleton for Fingerprint data services"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jpype1",
    "python-multipart",
    "httpx",
    "google-cloud-storage>=3.9.0",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
